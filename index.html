<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Acoustic-Drone-Detection-/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AeroSense AI — Acoustic Drone Detection</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { background: #faf9f6; }

      #splash {
        position: fixed;
        inset: 0;
        background: #faf9f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Radar ring container */
      .splash-radar {
        position: relative;
        width: 120px;
        height: 120px;
        margin-bottom: 32px;
      }

      /* Outer pulsing ring */
      .splash-radar::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(90, 51, 36, 0.3);
        animation: radarPulse 2.4s ease-out infinite;
      }
      .splash-radar::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid rgba(90, 51, 36, 0.2);
        animation: radarPulse 2.4s ease-out 0.8s infinite;
      }

      /* Static inner ring */
      .radar-ring {
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        border: 1px solid rgba(90, 51, 36, 0.18);
      }

      /* Crosshair lines */
      .radar-cross-h, .radar-cross-v {
        position: absolute;
        background: rgba(90, 51, 36, 0.2);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
      }
      .radar-cross-h { width: 100%; height: 1px; }
      .radar-cross-v { width: 1px; height: 100%; }

      /* Rotating sweep arm */
      .radar-sweep {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        animation: radarSweep 2.4s linear infinite;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(90, 51, 36, 0.0) 250deg,
          rgba(90, 51, 36, 0.15) 310deg,
          rgba(90, 51, 36, 0.4) 355deg,
          transparent 360deg
        );
      }

      /* Center dot */
      .radar-dot {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 6px; height: 6px;
        background: #5A3324;
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(90, 51, 36, 0.5);
      }

      /* Blip that appears on sweep */
      .radar-blip {
        position: absolute;
        width: 5px; height: 5px;
        background: #5A3324;
        border-radius: 50%;
        top: 28%; left: 62%;
        box-shadow: 0 0 8px rgba(90, 51, 36, 0.8);
        animation: blipPulse 2.4s ease-out infinite;
      }

      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes radarPulse {
        0%   { transform: scale(1);   opacity: 0.6; }
        70%  { transform: scale(1.5); opacity: 0; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      @keyframes blipPulse {
        0%, 14%  { opacity: 0; }
        15%, 35% { opacity: 1; }
        55%, 100%{ opacity: 0; }
      }

      /* Text */
      .splash-brand {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #5A3324;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .splash-sub {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.3em;
        color: #A9A9A9;
        text-transform: uppercase;
      }

      /* Loading bar */
      .splash-bar-track {
        margin-top: 28px;
        width: 160px;
        height: 2px;
        background: rgba(90, 51, 36, 0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #5A3324, #8B5E52);
        border-radius: 2px;
        animation: barLoad 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes barLoad {
        0%   { width: 0%; }
        60%  { width: 70%; }
        85%  { width: 88%; }
        100% { width: 100%; }
      }
    </style>
    <script type="module" crossorigin src="/Acoustic-Drone-Detection-/assets/index-CjzGrXlm.js"></script>
    <link rel="stylesheet" crossorigin href="/Acoustic-Drone-Detection-/assets/index-C32Ghr3m.css">
  </head>
  <body>
    <!-- Splash screen: shown instantly before React loads -->
    <div id="splash">
      <div class="splash-radar">
        <div class="radar-ring"></div>
        <div class="radar-cross-h"></div>
        <div class="radar-cross-v"></div>
        <div class="radar-sweep"></div>
        <div class="radar-blip"></div>
        <div class="radar-dot"></div>
      </div>
      <div class="splash-brand">AeroSense AI</div>
      <div class="splash-sub">Acoustic Drone Detection</div>
      <div class="splash-bar-track">
        <div class="splash-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <script>
      // Fade out splash once the page is fully ready
      window.addEventListener('load', function () {
        setTimeout(function () {
          var splash = document.getElementById('splash');
          if (splash) splash.classList.add('hidden');
        }, 200);
      });
    </script>
  </body>
</html>
